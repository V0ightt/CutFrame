name: Feature request
description: Propose a focused improvement to CutFrame
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        CutFrame favors local-first, dependency-light improvements. It will not add
        DRM circumvention, access-control bypasses, automatic browser-cookie access,
        telemetry, accounts, or cloud media storage.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem is difficult today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful behavior, not only an implementation.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include existing browser, FFmpeg, or workflow alternatives.

  - type: textarea
    id: impact
    attributes:
      label: Security, privacy, and dependency impact
      description: Identify new network access, file access, subprocesses, packages, or resource use.
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This request preserves CutFrame's local-first purpose and responsible-use policy.
          required: true
