name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.12"
          - "3.14"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"

      - name: Upgrade installer
        run: python -m pip install --upgrade "pip>=26.1.2"

      - name: Install runtime and development requirements
        run: python -m pip install --requirement requirements-dev.txt

      - name: Check installed dependencies
        run: python -m pip check

      - name: Compile Python
        run: python -m compileall -q app.py tests

      - name: Lint Python correctness rules
        run: python -m ruff check app.py tests

      - name: Check JavaScript syntax
        run: node --check static/app.js

      - name: Check browser smoke script syntax
        run: node --check scripts/browser_smoke.mjs

      - name: Run Python tests
        run: python -m pytest -q

      - name: Run browser smoke and responsive checks
        run: node scripts/browser_smoke.mjs

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt

      - name: Upgrade installer
        run: python -m pip install --upgrade "pip>=26.1.2"

      - name: Install audit tooling
        run: python -m pip install --constraint constraints.txt pip-audit

      - name: Audit runtime and development requirements
        run: python -m pip_audit --requirement requirements-dev.txt
